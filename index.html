<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheBlitzGamer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .logo {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #e74c3c;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin-bottom: 12px;
    }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 30px; }
    .search {
      width: 100%; max-width: 500px;
      padding: 12px 16px; border-radius: 8px;
      border: 1px solid #333; background: #1a1a1a;
      color: #fff; font-size: 1rem; margin-bottom: 30px; outline: none;
    }
    .search:focus { border-color: #555; }
    .list { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: border-color 0.2s;
    }
    .card:hover { border-color: #555; }
    .card h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .card p { font-size: 0.85rem; color: #999; }
    .card .arrow { font-size: 1.2rem; color: #666; }
  </style>
</head>
<body>
  <div class="logo">🎮</div>
  <h1>TheBlitzGamer</h1>
  <input class="search" type="text" placeholder="Search...">
  <div class="list">
    <div class="card"><div><h2>Item One</h2><p>Description here</p></div><span class="arrow">→</span></div>
    <div class="card"><div><h2>Item Two</h2><p>Another description</p></div><span class="arrow">→</span></div>
    <div class="card"><div><h2>Item Three</h2><p>One more thing</p></div><span class="arrow">→</span></div>
  </div>
</body>
</html>
